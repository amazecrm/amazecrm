schema_version: v1
name: amazecrm-linear
enabled: true

# Linear: when an issue moves to Todo, spawn an agent in amazecrm-dev.
trigger:
  linear:
    event: status_changed
    # Optional Linear workspace label (matches hub issue-tracker connection).
    workspace: amazecrm
    states:
      - Todo
    # labels: [bug, claw-ready]
    # exclude_labels: [do-not-automate]
    # assigned_to: "@username"  # or !@username, any, none

provider: daytona
concurrency_group: amazecrm-linear

# Env var → workspace/server secret name (resolved at agent creation).
secret_refs:
  LINEAR_API_KEY: linear_api_key

enable_manual_trigger: true

stages:
  - id: working
    label: Working
    entry: true
    on_enter:
      move_issue: In Progress
      inject: |
        New task: **{{.Issue.Identifier}}** — {{.Issue.Title}}
        {{.Issue.URL}}

        Read the full issue details with your Linear tools, understand the requirements, then implement and open PR(s). Follow each touched repo's conventions.
        Ask questions if anything is unclear.

        IMPORTANT:
          Before starting work, describe your understanding of the task (including which repo(s) you will change) but do not wait for a response.
          While working, keep the user updated on your progress with short updates.

  - id: pr_opened
    label: PR Opened
    triggers:
      - message_contains: "[DONE]"
    on_enter:
      move_issue: Agent Needs Review
      inject: |
        PR created. Watch for CI results and review comments.

  - id: merged
    label: Merged
    triggers:
      - pr_merged: {}
    on_enter:
      move_issue: Done
      inject: |
        PR was merged. Terminating this agent.
    terminal: true

  - id: closed_no_merge
    label: Closed Without Merge
    triggers:
      - pr_closed: {}
    terminal: true
    on_enter:
      inject: |
        PR was closed without merging. Terminating this agent.
