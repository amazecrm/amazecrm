schema_version: v1
name: amazecrm-linear
enabled: true

# Linear: when an issue moves to Todo, spawn an agent in amazecrm-dev.
trigger:
  linear:
    event: status_changed
    # Optional Linear workspace label (matches hub issue-tracker connection).
    workspace: amazecrm
    states:
      - Todo
    # labels: [bug, claw-ready]
    # exclude_labels: [do-not-automate]
    # assigned_to: "@username"  # or !@username, any, none

provider: daytona
concurrency_group: amazecrm-linear

# Env var → workspace/server secret name (resolved at agent creation).
secret_refs:
  LINEAR_API_KEY: linear_api_key

enable_manual_trigger: true

# Plan approval via plan_gate (schema check on .elasticclaw/plan.json).
# Docs: https://elasticclaw.ai/docs/workflows#plan-approval
stages:
  - id: plan
    label: Plan
    entry: true
    on_enter:
      move_issue: In Progress
      inject: |
        New task: **{{.Issue.Identifier}}** — {{.Issue.Title}}
        {{.Issue.URL}}

        ## What humans watching this chat need
        Tool activity alone is NOT enough. Write plain assistant messages they can read.

        ## Plan stage (do this first)
        1. Read the Linear issue if you need more detail.
        2. Write `.elasticclaw/plan.json` with:
             understanding  (string)
             area           (string) — repos/packages/files
             steps          (array of strings)
             verification   (string)
        3. Send ONE visible chat message that includes:
             - Your understanding of the issue (2–4 sentences)
             - Likely files / areas
             - Numbered steps
             - How you will verify
             - Then on its own line: [PLAN_READY]
        4. Do NOT implement product code until the Implement stage injects proceed.
        5. Do NOT only say [PLAN_READY] with no plan text above it.

        Follow each touched repo's conventions. Ask questions if anything is unclear.

  - id: plan_validate
    label: Validate plan
    plan_gate: true
    triggers:
      - message_contains: "[PLAN_READY]"
    on_enter:
      run:
        # Schema check + echo plan fields so the hub can show them in chat.
        command: |
          python3 - <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(".elasticclaw/plan.json")
          try:
              data = json.loads(path.read_text())
          except Exception as exc:
              print(json.dumps({"status": "incomplete", "reason": f"unreadable plan.json: {exc}"}))
              sys.exit(0)
          if not isinstance(data, dict):
              print(json.dumps({"status": "incomplete", "reason": "plan.json must contain a JSON object"}))
              sys.exit(0)
          string_fields = ("understanding", "area", "verification")
          invalid = [
              k for k in string_fields
              if not isinstance(data.get(k), str) or not data[k].strip()
          ]
          steps = data.get("steps")
          if invalid:
              print(json.dumps({"status": "incomplete", "reason": f"invalid {invalid}"}))
          elif not isinstance(steps, list) or not steps or any(
              not isinstance(step, str) or not step.strip() for step in steps
          ):
              print(json.dumps({
                  "status": "incomplete",
                  "reason": "steps must be a non-empty list of strings",
              }))
          else:
              print(json.dumps({
                  "status": "ok",
                  "understanding": data["understanding"].strip(),
                  "area": data["area"].strip(),
                  "steps": [s.strip() for s in steps],
                  "verification": data["verification"].strip(),
              }))
          PY
        output: plan
        timeout: 2m
    gate:
      output: plan
      pass:
        path: status
        values:
          - ok
      fail:
        path: status
        values:
          - incomplete
      required: true

  - id: implement
    label: Implement
    triggers:
      - gate_result:
          stage: plan_validate
          verdict: pass
    on_enter:
      inject: |
        ## Starting implementation for {{.Issue.Identifier}}

        Plan approved (status {{ .Outputs.plan.status }}) — coding begins now.
        Do not wait for another proceed message. Do not emit [PLAN_READY] again.

        ## Visible progress (required)
        Humans cannot follow tool rows alone. Post short plain-chat updates:

        1. First message (before edits): what you're starting with.
        2. After setup (deps/branch): what you did + next step.
        3. After substantive code changes: files touched + why.
        4. After checks (lint/typecheck/tests): pass/fail + fix plan if failed.
        5. When opening the PR: summary + [DONE] with the PR URL(s).

        Format tip: 1–3 sentences per update, not essays. Prefer frequent short posts.

        Follow amazecrm/amazecrm conventions. When the PR is ready:
        [DONE] https://github.com/amazecrm/amazecrm/pull/N

  - id: fix_plan
    label: Fix plan
    triggers:
      - gate_result:
          stage: plan_validate
          verdict: fail
    on_enter:
      inject: |
        Plan incomplete: {{ .Outputs.plan.reason }}

        Update `.elasticclaw/plan.json`, then send a visible revised plan summary
        and end with [PLAN_READY] on its own line.
        Do not implement product code until the plan gate passes.

  - id: pr_opened
    label: PR Opened
    triggers:
      - message_contains: "[DONE]"
    on_enter:
      move_issue: Agent Needs Review
      inject: |
        PR created. Watch for CI results and review comments.
        Post short visible updates when CI fails or reviews request changes.

  - id: merged
    label: Merged
    triggers:
      - pr_merged: {}
    on_enter:
      move_issue: Done
      inject: |
        PR was merged. Terminating this agent.
    terminal: true

  - id: closed_no_merge
    label: Closed Without Merge
    triggers:
      - pr_closed: {}
    terminal: true
    on_enter:
      inject: |
        PR was closed without merging. Terminating this agent.
