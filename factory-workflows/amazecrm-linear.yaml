schema_version: v1
name: amazecrm-linear
enabled: true

# Linear: when an issue moves to Todo, spawn an agent in amazecrm-dev.
trigger:
  linear:
    event: status_changed
    # Optional Linear workspace label (matches hub issue-tracker connection).
    workspace: amazecrm
    states:
      - Todo
    # labels: [bug, claw-ready]
    # exclude_labels: [do-not-automate]
    # assigned_to: "@username"  # or !@username, any, none

provider: daytona
concurrency_group: amazecrm-linear

# Env var → workspace/server secret name (resolved at agent creation).
secret_refs:
  LINEAR_API_KEY: linear_api_key

enable_manual_trigger: true

# Plan approval: plan_gate: true on plan_validate opts out of freeform hub
# keyword plan checks. Plan acceptance is schema-only (plan.json fields) via a
# deterministic gate. Requires ElasticClaw hub with plan_gate support.
# Docs: https://elasticclaw.ai/docs/workflows#plan-approval
stages:
  - id: plan
    label: Plan
    entry: true
    on_enter:
      move_issue: In Progress
      inject: |
        New task: **{{.Issue.Identifier}}** — {{.Issue.Title}}
        {{.Issue.URL}}

        Before implementing, write `.elasticclaw/plan.json` with:
          understanding  (string) — what the issue requires
          area           (string) — repos/packages/files likely involved
          steps          (array of strings) — rough implementation plan
          verification   (string) — how you will verify (tests, typecheck, manual)

        Then say exactly: [PLAN_READY]
        Do not edit product code until the next stage injects proceed.

        Read the full issue details with your Linear tools if needed to fill the plan.
        Follow each touched repo's conventions. Ask questions if anything is unclear.

  - id: plan_validate
    label: Validate plan
    plan_gate: true
    triggers:
      - message_contains: "[PLAN_READY]"
    on_enter:
      run:
        # Schema-only check — no NLP. Prints JSON for the gate.
        command: |
          python3 - <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(".elasticclaw/plan.json")
          required = ("understanding", "area", "steps", "verification")
          try:
              data = json.loads(path.read_text())
          except Exception as exc:
              print(json.dumps({"status": "incomplete", "reason": f"unreadable plan.json: {exc}"}))
              sys.exit(0)
          missing = [k for k in required if not data.get(k)]
          if missing:
              print(json.dumps({"status": "incomplete", "reason": f"missing fields: {missing}"}))
          elif not isinstance(data.get("steps"), list) or not data["steps"]:
              print(json.dumps({"status": "incomplete", "reason": "steps must be a non-empty list"}))
          else:
              print(json.dumps({"status": "ok"}))
          PY
        output: plan
        timeout: 2m
    gate:
      output: plan
      pass:
        path: status
        values:
          - ok
      fail:
        path: status
        values:
          - incomplete
      required: true

  - id: implement
    label: Implement
    triggers:
      - gate_result:
          stage: plan_validate
          verdict: pass
    on_enter:
      inject: |
        Plan accepted (status {{ .Outputs.plan.status }}).
        Implement the issue now. Follow each touched repo's conventions.
        Narrate progress with short updates.
        When the PR is ready, say [DONE] with the PR URL(s).

  - id: fix_plan
    label: Fix plan
    triggers:
      - gate_result:
          stage: plan_validate
          verdict: fail
    on_enter:
      inject: |
        Plan incomplete: {{ .Outputs.plan.reason }}
        Update `.elasticclaw/plan.json`, then say [PLAN_READY] again.
        Do not implement product code until the plan gate passes.

  - id: pr_opened
    label: PR Opened
    triggers:
      - message_contains: "[DONE]"
    on_enter:
      move_issue: Agent Needs Review
      inject: |
        PR created. Watch for CI results and review comments.

  - id: merged
    label: Merged
    triggers:
      - pr_merged: {}
    on_enter:
      move_issue: Done
      inject: |
        PR was merged. Terminating this agent.
    terminal: true

  - id: closed_no_merge
    label: Closed Without Merge
    triggers:
      - pr_closed: {}
    terminal: true
    on_enter:
      inject: |
        PR was closed without merging. Terminating this agent.
